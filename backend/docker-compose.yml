services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: http://localhost:5173
      DATABASE_URL: sqlite:////app/data/cpu_scheduler.db
      MODEL_DIR: /app/data/models
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - backend_data:/app/data
volumes:
  backend_data:
